# Tiny Tapeout project information
project:
  title:        "SRAM Scratchpad"      # Project title
  author:       "ofek9993"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "1024x8 IHP SRAM scratchpad with auto-incrementing write pointer"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # 20 ns CLOCK_PERIOD in src/config.json = 50 MHz

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Jane Street rules: current max is 6x4 (8x4 may come later)
                      # Real CMOS5L list: 1x1 1x2 2x1 2x2 3x1 3x2 3x4 4x1 4x2
                      #                   4x4 5x4 6x1 6x2 6x4 8x1 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ofek9993_protoemu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "sram_wrapper.v"
    - "write_pointer.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "WDATA0"
  ui[1]: "WDATA1"
  ui[2]: "WDATA2"
  ui[3]: "WDATA3"
  ui[4]: "WDATA4"
  ui[5]: "WDATA5"
  ui[6]: "WDATA6"
  ui[7]: "WDATA7"

  # Outputs
  uo[0]: "RDATA0"
  uo[1]: "RDATA1"
  uo[2]: "RDATA2"
  uo[3]: "RDATA3"
  uo[4]: "RDATA4"
  uo[5]: "RDATA5"
  uo[6]: "RDATA6"
  uo[7]: "RDATA7"

  # Bidirectional pins
  uio[0]: "WE"
  uio[1]: "CLR_PTR"
  uio[2]: "RADDR0"
  uio[3]: "RADDR1"
  uio[4]: "RADDR2"
  uio[5]: "RADDR3"
  uio[6]: "RADDR4"
  uio[7]: "RADDR5"

# Do not change!
yaml_version: 6
