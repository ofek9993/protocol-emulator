# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "ofek9993"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable protocol emulator: UART, SPI and I2C run as loaded state tables"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # 20 ns CLOCK_PERIOD in src/config.json = 50 MHz

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Jane Street rules: current max is 6x4 (8x4 may come later)
                      # Real CMOS5L list: 1x1 1x2 2x1 2x2 3x1 3x2 3x4 4x1 4x2
                      #                   4x4 5x4 6x1 6x2 6x4 8x1 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ofek9993_protoemu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pemu_core.v"
    - "pemu_pins.v"
    - "pemu_ctrl.v"
    - "pemu_timer.v"
    - "pemu_shifter.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs - serial configuration port
  ui[0]: "CFG_SCK"
  ui[1]: "CFG_SDI"
  ui[2]: "CFG_CS"
  # Inputs - protocol input pins (logical pins 8..11)
  ui[3]: "UART_RX / P8"
  ui[4]: "P9"
  ui[5]: "P10"
  ui[6]: "P11"
  ui[7]: ""

  # Outputs - config read-back, controller READY, protocol outputs (logical 12..15)
  uo[0]: "CFG_SDO"
  uo[1]: "READY"
  uo[2]: ""
  uo[3]: ""
  uo[4]: "UART_TX / P12"
  uo[5]: "P13"
  uo[6]: "P14"
  uo[7]: "P15"

  # Bidirectional - protocol pins (logical 0..7), Tiny Tapeout standard roles
  uio[0]: "SPI_CS / P0"
  uio[1]: "SPI_MOSI / P1"
  uio[2]: "SPI_MISO / I2C_SCL / P2"
  uio[3]: "SPI_SCK / I2C_SDA / P3"
  uio[4]: "P4"
  uio[5]: "P5"
  uio[6]: "P6"
  uio[7]: "P7"
# Do not change!
yaml_version: 6
